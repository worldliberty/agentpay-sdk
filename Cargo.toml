[workspace]
members = [
    "crates/vault-domain",
    "crates/vault-policy",
    "crates/vault-signer",
    "crates/vault-daemon",
    "crates/vault-transport-unix",
    "crates/vault-sdk-agent",
    "crates/vault-cli-admin",
    "crates/vault-cli-agent",
    "crates/vault-cli-daemon",
    "crates/vault-transport-xpc",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.5.1"
rust-version = "1.89"
authors = ["AgentPay SDK Team"]

[profile.release]
overflow-checks = true

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10"
alloy-chains = "0.2.33"
alloy-dyn-abi = { version = "0.8.26", features = ["eip712"] }
alloy-primitives = "0.8"
alloy-sol-types = "1.5"
anyhow = "1"
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ed-on-bn254 = "0.5"
ark-ff = { version = "0.5", features = ["std"] }
ark-serialize = "0.5"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
bech32 = "0.11"
bincode = "1.3"
bip39 = { version = "2", default-features = false, features = ["std"] }
blake512-hash = "0.1"
block = "0.1"
bs58 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
core-foundation = "0.10"
crossterm = "0.28"
curve25519-dalek = { version = "4", features = ["digest"] }
ed25519-dalek = { version = "3.0.0-pre.6", features = ["rand_core"] }
generic-array = "0.14"
ghash = "0.5"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
k256 = { version = "0.13", features = ["ecdsa"] }
libc = "0.2"
light-poseidon = "0.4"
pbkdf2 = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ratatui = "0.29"
rpassword = "7"
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = "2.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-sdk = "4.0.1"
spl-associated-token-account = "8.0.0"
spl-token = "9.0.0"
spl-token-2022-interface = "2.1.0"
thiserror = "2"
time = { version = "=0.3.36", features = ["macros", "serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time", "signal"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
