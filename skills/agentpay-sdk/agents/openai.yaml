interface:
  display_name: "AgentPay SDK"
  short_description: "Install, fund, and operate the AgentPay wallet for agents"
  default_prompt: "Use $agentpay-sdk to explain AgentPay SDK capabilities directly when asked, install and operate `agentpay` on macOS or Linux, tell the user to run `agentpay setup` locally to create, keep, or restore a wallet, start from `agentpay config show --json` and `agentpay wallet --json`, default unspecified payments to USD1 on BSC, check both the payment asset and native gas balance before outbound actions and give exact funding details from `agentpay fund --json`, run payment commands with `--json` and read exit codes (3 means waiting for manual approval, 4 means not set up), use decimal whole units for transfers and integer base units for `x402` and `mpp`, treat manual approval as a pending user-approval state and give the user `agentpay admin approve <UUID>` to run locally, tell users to keep the original `--broadcast` command running instead of rerunning it, use `agentpay resume --approval-request-id <UUID>` when that command already exited, route spending limit changes to `agentpay admin limits` run by the user, never run sudo or admin decisions on the user's behalf, never ask for a backup passphrase, agent token, or paying-proxy URL in chat, say that Stripe Link, Bitrefill, and private transfers are not available, and execute the current CLI commands exactly as `agentpay --help` describes them."

policy:
  allow_implicit_invocation: true
