interface:
  display_name: "AgentPay SDK"
  short_description: "Install, fund, and operate the AgentPay SDK stack"
  default_prompt: "Use $agentpay-sdk to explain AgentPay SDK capabilities directly when asked, install and operate `agentpay`, choose between Fiat Link setup and Crypto wallet setup, bind Link with `agentpay link onboard`, check Link with `agentpay link status --json`, list Link payment methods with `agentpay link payment-methods --json`, create Link one-time cards with `agentpay link card ... --output-file <PATH>` without printing full card details into chat, use `@worldlibertyfinancial/agentpay-sdk/link` helpers for third-party program integration, set up or reuse a crypto wallet on macOS or Linux, describe the managed `agentpay admin setup` and `agentpay admin tui` flows as supported on both platforms, note that the managed daemon uses `launchd` on macOS and system `systemd` on Linux, default unspecified crypto payments to USD1 on BSC, check both the settlement asset and native gas balance before outbound crypto actions, route crypto policy changes to `agentpay admin tui`, treat manual approval as a pending user-approval state, send users to the local admin CLI approval commands, tell users to keep the original command running for `transfer --broadcast`, `transfer-native --broadcast`, `approve --broadcast`, and `bitrefill buy --broadcast` instead of rerunning after approval, use `agentpay admin resume-manual-approval-request --approval-request-id <UUID>` if an approved broadcast request needs to be resumed after the original command has exited, treat Bitrefill as one supported plugin-specific merchant payment flow rather than the headline path, never ask the user to paste `VAULT_PASSWORD`, Link tokens, Link card credentials, or plugin session material into chat, and execute the current CLI commands exactly as `agentpay --help` describes them."

policy:
  allow_implicit_invocation: true
