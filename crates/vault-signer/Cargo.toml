[package]
name = "vault-signer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
interactive-secure-enclave-tests = []

[dependencies]
aes.workspace = true
aes-gcm.workspace = true
ark-bn254.workspace = true
ark-ec.workspace = true
ark-ed-on-bn254.workspace = true
ark-ff.workspace = true
ark-serialize.workspace = true
async-trait.workspace = true
bech32.workspace = true
bip39.workspace = true
blake512-hash.workspace = true
bs58.workspace = true
curve25519-dalek.workspace = true
ed25519-dalek.workspace = true
generic-array.workspace = true
hex.workspace = true
hmac.workspace = true
k256.workspace = true
libc.workspace = true
light-poseidon.workspace = true
pbkdf2.workspace = true
rand.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
vault-domain = { path = "../vault-domain" }
x25519-dalek.workspace = true
zeroize.workspace = true

# macOS Secure Enclave backend requires Core Foundation and Security framework.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
security-framework.workspace = true
security-framework-sys.workspace = true

# Windows TPM backend requires tokio for spawn_blocking and serde_json for
# sealed blob serialization.
[target.'cfg(target_os = "windows")'.dependencies]
tokio.workspace = true
serde_json.workspace = true
windows-sys = { version = "0.61", features = ["Win32_System_TpmBaseServices"] }

# Linux TPM backend requires tokio for spawn_blocking and serde_json for
# sealed blob serialization.
[target.'cfg(target_os = "linux")'.dependencies]
tokio.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
