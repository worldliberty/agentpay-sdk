name: Installer Smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish, for example v0.5.0
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: installer-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ONE_CLICK_RELEASE_REPO: ${{ github.repository }}
  ONE_CLICK_INSTALLER_ASSET: installer.sh
  ONE_CLICK_CHECKSUMS_ASSET: SHA256SUMS

permissions:
  contents: read

jobs:
  installer-smoke:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            bundle_name: agentpay-sdk-linux-x64.tar.gz
            artifact_name: agentpay-installer-bundle-linux-x64
            smoke_logs_name: installer-smoke-logs-linux-x64
            run_unit_tests: true
          - runner: macos-15-intel
            bundle_name: agentpay-sdk-macos-x64.tar.gz
            artifact_name: agentpay-installer-bundle-macos-x64
            smoke_logs_name: installer-smoke-logs-macos-x64
            run_unit_tests: false
          - runner: macos-15
            bundle_name: agentpay-sdk-macos-arm64.tar.gz
            artifact_name: agentpay-installer-bundle-macos-arm64
            smoke_logs_name: installer-smoke-logs-macos-arm64
            run_unit_tests: true

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SMOKE_DIR: ${{ github.workspace }}/.agentpay-installer-smoke-${{ matrix.runner }}
      BUNDLE_NAME: ${{ matrix.bundle_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-09)
        with:
          toolchain: 1.89.0

      - name: Validate installer scripts
        run: |
          bash -n scripts/installer.sh
          bash -n scripts/run-installer-smoke.sh

      - name: Run installer unit tests
        if: ${{ matrix.run_unit_tests }}
        run: node --test test/setup-agentpay-script.test.mjs test/installer-smoke-script.test.mjs
        env:
          AGENTPAY_TELEMETRY: '0'

      - name: Build precompiled installer bundle
        run: |
          npm run build
          cargo build --locked --release \
            -p agentpay-daemon \
            -p agentpay-admin \
            -p agentpay-agent
          bundle_path="$RUNNER_TEMP/$BUNDLE_NAME"
          node scripts/build-installer-bundle.mjs --output "$bundle_path"
          # One "<sha256>  <asset>" line per bundle; the release job merges these into SHA256SUMS.
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const [bundlePath, assetName, outputPath] = process.argv.slice(1);
            const digest = crypto.createHash("sha256").update(fs.readFileSync(bundlePath)).digest("hex");
            fs.writeFileSync(outputPath, `${digest}  ${assetName}\n`);
            console.log(`${digest}  ${assetName}`);
          ' "$bundle_path" "$BUNDLE_NAME" "$bundle_path.sha256"
          echo "BUNDLE_ARCHIVE=$bundle_path" >> "$GITHUB_ENV"
          echo "BUNDLE_CHECKSUM=$bundle_path.sha256" >> "$GITHUB_ENV"

      - name: Upload precompiled installer bundle and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ env.BUNDLE_ARCHIVE }}
            ${{ env.BUNDLE_CHECKSUM }}
          if-no-files-found: error

      - name: Run installer smoke
        run: bash scripts/run-installer-smoke.sh --work-dir "$SMOKE_DIR" --bundle-archive "$BUNDLE_ARCHIVE"

      - name: Upload installer smoke logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.smoke_logs_name }}
          path: ${{ env.SMOKE_DIR }}/logs
          if-no-files-found: ignore

  publish-one-click-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - installer-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      EVENT_NAME: ${{ github.event_name }}
      RELEASE_TAG_INPUT: ${{ github.event.inputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release tag
        id: tag
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$RELEASE_TAG_INPUT"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if ! printf '%s' "$release_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "Release tag must look like v0.5.0, got: $release_tag" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Assert the release tag matches package.json and the Cargo workspace version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.RELEASE_TAG;
            const expected = tag.replace(/^v/, "");
            const packageVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const cargoToml = fs.readFileSync("Cargo.toml", "utf8");
            const workspacePackage = cargoToml.split(/^\[workspace\.package\]\s*$/m)[1]?.split(/^\[/m)[0] ?? "";
            const cargoVersion = workspacePackage.match(/^version\s*=\s*"([^"]+)"/m)?.[1] ?? "<missing>";
            const problems = [];
            if (packageVersion !== expected) problems.push(`package.json version ${packageVersion} does not match release tag ${tag}`);
            if (cargoVersion !== expected) problems.push(`Cargo [workspace.package] version ${cargoVersion} does not match release tag ${tag}`);
            if (problems.length > 0) {
              console.error(problems.join("\n"));
              process.exit(1);
            }
            console.log(`release tag ${tag} matches package.json and Cargo workspace version ${expected}`);
          '

      - name: Download bundle artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agentpay-installer-bundle-*
          path: bundles
          merge-multiple: true

      - name: Assemble and verify SHA256SUMS
        run: |
          cd bundles
          ls -la
          cat ./*.sha256 | sort -k2 > "$ONE_CLICK_CHECKSUMS_ASSET"
          rm -f ./*.sha256
          echo "Published checksums:"
          cat "$ONE_CLICK_CHECKSUMS_ASSET"
          sha256sum --check --strict "$ONE_CLICK_CHECKSUMS_ASSET"

      - name: Prepare installer release assets
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          digest_for() {
            awk -v name="$1" '$2 == name { print $1 }' "bundles/$ONE_CLICK_CHECKSUMS_ASSET"
          }
          export SHA_MACOS_ARM64="$(digest_for agentpay-sdk-macos-arm64.tar.gz)"
          export SHA_MACOS_X64="$(digest_for agentpay-sdk-macos-x64.tar.gz)"
          export SHA_LINUX_X64="$(digest_for agentpay-sdk-linux-x64.tar.gz)"
          export SHA_LINUX_ARM64="$(digest_for agentpay-sdk-linux-arm64.tar.gz)"
          for required in SHA_MACOS_ARM64 SHA_MACOS_X64 SHA_LINUX_X64; do
            if [ -z "${!required}" ]; then
              echo "Missing bundle digest for $required in $ONE_CLICK_CHECKSUMS_ASSET" >&2
              exit 1
            fi
          done

          mkdir -p published-assets
          perl -0pe '
            s/__AGENTPAY_PUBLIC_RELEASE_REPO__/$ENV{ONE_CLICK_RELEASE_REPO}/g;
            s/__AGENTPAY_PUBLIC_RELEASE_TAG__/$ENV{RELEASE_TAG}/g;
            s/__AGENTPAY_PUBLIC_BUNDLE_SHA256_MACOS_ARM64__/$ENV{SHA_MACOS_ARM64}/g;
            s/__AGENTPAY_PUBLIC_BUNDLE_SHA256_MACOS_X64__/$ENV{SHA_MACOS_X64}/g;
            s/__AGENTPAY_PUBLIC_BUNDLE_SHA256_LINUX_X64__/$ENV{SHA_LINUX_X64}/g;
            s/__AGENTPAY_PUBLIC_BUNDLE_SHA256_LINUX_ARM64__/$ENV{SHA_LINUX_ARM64}/g;
          ' scripts/installer.sh > "published-assets/$ONE_CLICK_INSTALLER_ASSET"
          chmod 755 "published-assets/$ONE_CLICK_INSTALLER_ASSET"

          if grep -q '__AGENTPAY_' "published-assets/$ONE_CLICK_INSTALLER_ASSET"; then
            echo "Installer template still contains unresolved placeholders:" >&2
            grep -n '__AGENTPAY_' "published-assets/$ONE_CLICK_INSTALLER_ASSET" >&2
            exit 1
          fi
          bash -n "published-assets/$ONE_CLICK_INSTALLER_ASSET"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          release_repo="$ONE_CLICK_RELEASE_REPO"
          release_title="AgentPay SDK ${RELEASE_TAG}"
          release_notes="Precompiled AgentPay SDK bundles for ${RELEASE_TAG}. Verify downloads against ${ONE_CLICK_CHECKSUMS_ASSET}."

          if gh release view "$RELEASE_TAG" --repo "$release_repo" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$release_repo" \
              --title "$release_title" \
              --notes "$release_notes"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$release_repo" \
              --title "$release_title" \
              --notes "$release_notes"
          fi

          # No --clobber: release assets are immutable once published. Re-running against an
          # existing release with assets fails on purpose instead of silently replacing them.
          gh release upload "$RELEASE_TAG" \
            --repo "$release_repo" \
            bundles/*.tar.gz \
            "bundles/$ONE_CLICK_CHECKSUMS_ASSET" \
            "published-assets/$ONE_CLICK_INSTALLER_ASSET"
