bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 60
protected-mode yes
# Development-only credential; compose.yml publishes the port on 127.0.0.1 only.
# Keep this in sync with the healthcheck and REDIS_HOSTS in compose.yml and with README.md.
requirepass agentpay-dev-only
daemonize no
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
dir /data
maxmemory-policy noeviction
